name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: backend/go.sum

      - name: Check formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test -count=1 ./internal/...

      - name: Start PostgreSQL
        run: |
          sudo systemctl start postgresql
          sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'postgres';"
          sudo -u postgres psql -c "CREATE USER surl_test PASSWORD 'postgres';" || true
          sudo -u postgres createdb -O surl_test surl_test || true
          go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@v4.17.1

      - name: Run migrations
        run: migrate -path migrations -database "$TEST_DATABASE_URL" up
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/surl_test?sslmode=disable

      - name: Integration tests
        env:
          APP_ENV: test
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/surl_test?sslmode=disable
        run: go test -tags=integration -count=1 ./test/...

  frontend:
    name: Frontend (Vue)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          npm install -g npm@latest
          npm ci || npm ci

      - name: Format check
        run: npm run format:check

      - name: Typecheck + build
        run: npm run build
